<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Симулятор риска: InvestStart</title><meta name="theme-color" content="#fbfbfa"><link rel="stylesheet" href="assets/style.css"></head><body data-p="simulator"><section style="padding-top:40px"><div class="wrap"><h2>Симулятор риска</h2><p class="lead mb">Настройте сумму, срок и профиль. Мы просчитаем 500 сценариев рынка и покажем диапазон возможных результатов.</p>
<div class="dgrid"><div class="card"><div class="hd"><div><div class="k">Через <span id="yl"></span>, медианный сценарий</div><div class="bal" id="med"></div></div><span class="tag b" id="pn"></span></div><div class="chart" id="sc"></div><div class="row mut mt" style="font-size:12px;gap:18px"><span><i style="display:inline-block;width:10px;height:10px;background:#0071e3;opacity:.3;border-radius:2px"></i> 80% сценариев</span><span style="color:#0071e3">━ медиана</span><span>┅ вложено</span></div><div class="g3 mt" id="res"></div></div>
<div class="stack"><div class="card"><div class="fld"><label>Стартовая сумма <b id="va"></b></label><input type="range" id="am" min="10000" max="3000000" step="10000" value="300000"></div><div class="fld"><label>Пополнение в месяц <b id="vm"></b></label><input type="range" id="mo" min="0" max="150000" step="1000" value="15000"></div><div class="fld"><label>Срок <b id="vy"></b></label><input type="range" id="yr" min="1" max="30" value="10"></div><div class="k mb">Профиль риска</div><div class="chips" id="pf"></div></div>
<div class="card"><div class="k mb">Состав портфеля</div><div class="gauge" id="dn"></div><div class="legend" id="lg"></div></div></div></div><div class="card mt" id="ex"></div></div></section><script src="assets/app.js"></script><script>READY.then(()=>{shell();
const CL={bond:[.09,.06],stock:[.14,.28],etf:[.13,.22],gold:[.08,.15],crypto:[.25,.7],cash:[.06,0]};
const PR=[['Консервативный',{bond:.6,cash:.2,gold:.1,etf:.1},'Почти весь капитал в облигациях и деньгах. Просадки небольшие, но и рост скромный.'],['Умеренный',{bond:.4,etf:.25,stock:.15,gold:.1,cash:.1},'Облигации держат портфель, акции дают рост. Хороший старт для новичка.'],['Сбалансированный',{bond:.25,stock:.3,etf:.25,gold:.1,crypto:.05,cash:.05},'Половина в акциях. В плохой год портфель может потерять 15–20%, на длинном сроке это окупается.'],['Агрессивный',{stock:.45,etf:.2,bond:.1,crypto:.15,gold:.1},'Высокая доходность в хорошие годы и глубокие просадки в кризис. Нужен срок от 7 лет и крепкие нервы.'],['Максимальный',{stock:.4,crypto:.4,etf:.15,gold:.05},'Очень высокий риск. Портфель может терять половину стоимости. Подходит только для небольшой части капитала.']];
let P=1,raf;const am=$('#am'),mo=$('#mo'),yr=$('#yr');
const yw=n=>n%10==1&&n%100!=11?'год':[2,3,4].includes(n%10)&&![12,13,14].includes(n%100)?'года':'лет';
$('#pf').innerHTML=PR.map((p,i)=>`<button class="chip t ${i==P?'on':''}" data-i="${i}">${p[0]}</button>`).join('');
$$('#pf .chip').forEach(b=>b.onclick=()=>{P=+b.dataset.i;$$('#pf .chip').forEach(x=>x.classList.toggle('on',x==b));run()});
function st(){const w=PR[P][1];let mu=0,s2=0,sl=0;for(const k in w){const[m,v]=CL[k];mu+=w[k]*m;s2+=(w[k]*v)**2;sl+=w[k]*v}return{mu,v:Math.sqrt(s2+.3*(sl*sl-s2))}}
function run(){const a=+am.value,m=+mo.value,y=+yr.value,n=y*12,{mu,v}=st(),dm=Math.log(1+mu)/12-v*v/24,sm=v/Math.sqrt(12),K=500;
$('#va').textContent=rub(a);$('#vm').textContent=rub(m);$('#vy').textContent=y+' '+yw(y);$('#yl').textContent=y+' '+yw(y);$('#pn').textContent=PR[P][0];
let s=42;const rr=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const M=[...Array(n+1)].map(()=>new Float64Array(K));for(let k=0;k<K;k++){let x=a;M[0][k]=x;for(let i=1;i<=n;i++){x=x*Math.exp(dm+sm*gauss(rr))+m;M[i][k]=x}}
const lo=[],md=[],hi=[],inv=[];M.forEach((r,i)=>{const q=[...r].sort((p,q)=>p-q);lo.push(q[Math.floor(.1*K)]);md.push(q[K>>1]);hi.push(q[Math.floor(.9*K)]);inv.push(a+m*i)});
const I=inv[n],loss=[...M[n]].filter(x=>x<I).length/K,bad=Math.max(-.95,Math.exp(Math.log(1+mu)-v*v/2-1.645*v)-1);
const lb=[...Array(n+1)].map((_,i)=>i==0?'Сейчас':i<12?i+' мес':(i/12|0)+' г'+(i%12?' '+i%12+' мес':''));
$('#med').textContent=rub(md[n]);
line($('#sc'),{s:[{d:md,c:'#0071e3',w:2.5},{d:inv,c:'#6e6e73',w:1.5,dash:1}],b:[{lo,hi,c:'#0071e3',o:.14}],l:lb,tf:i=>`<span class="mut">${lb[i]}</span><br>Медиана <b>${rub(md[i])}</b><br><span class="mut">80%: ${short(lo[i])} … ${short(hi[i])} ₽</span>`});
const C=[['Вложено',rub(I),''],['Плохой сценарий (10%)',rub(lo[n]),cls(lo[n]-I)],['Хороший сценарий (90%)',rub(hi[n]),'up'],['Ожидаемая доходность',pc(mu,1)+' / год','up'],['Шанс закончить в минусе',fm(loss*100,1)+'%',loss>.1?'dn':''],['Плохой год (1 из 20)',pc(bad,1),'dn']];
$('#res').innerHTML=C.map(c=>`<div class="stat" style="background:var(--card2);border:1px solid var(--line);padding:14px;border-radius:12px"><span>${c[0]}</span><b class="${c[2]}" style="font-size:19px">${c[1]}</b></div>`).join('');
const w=PR[P][1],it=Object.keys(w).map(k=>({n:KN[k],c:KC[k],v:w[k]})),sc=Math.min(10,Math.max(1,Math.round(v*25)));
donut($('#dn'),it,['Риск',sc+'/10']);$('#lg').innerHTML=it.map(x=>`<div><i style="background:${x.c}"></i>${x.n}<b>${fm(x.v*100)}%</b></div>`).join('');
$('#ex').innerHTML=`<div class="ai ${sc>6?'bad':sc>3?'warn':'good'}"><div class="ag">✦</div><div><b>AI-разбор профиля «${PR[P][0]}»: риск ${sc} из 10</b><p>${PR[P][2]} При вашем плане в ${fm(loss*100,0)}% сценариев итог окажется ниже вложенной суммы ${rub(I)}. Медианный результат превышает вложения в ${fm(md[n]/I,2)} раза. Волатильность портфеля ${fm(v*100,1)}% в год.</p></div></div>`}
[am,mo,yr].forEach(e=>e.oninput=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(run)});run();
});</script></body></html>
